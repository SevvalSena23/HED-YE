<script>
        // Matrix Yağmuru
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const katakana = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const alphabet = katakana.split('');

        const fontSize = 16;
        const columns = canvas.width / fontSize;

        const rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        const drawMatrix = () => {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#666'; 
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        };

        const matrixInterval = setInterval(drawMatrix, 30);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Yazıların ve Siyah-Beyaz Kalplerin Akışı
        const line1 = document.getElementById('line1');
        const line2 = document.getElementById('line2');
        const line3 = document.getElementById('line3'); // Yeni eklediğin satırı buraya tanımladık
        const heartContainer = document.getElementById('heart-container');

        // Zamanlama Ayarları (Milisaniye cinsinden)
        setTimeout(() => {
            line1.classList.add('show');
        }, 1500); // 1.5 saniye sonra ilk yazı

        setTimeout(() => {
            line2.classList.add('show');
        }, 3000); // 3 saniye sonra ikinci yazı

        setTimeout(() => {
            line3.classList.add('show');
        }, 4500); // 4.5 saniye sonra üçüncü yazı (EŞŞŞEK HERİFİM) ekrana gelecek

        setTimeout(() => {
            // Tüm yazılar geldikten sonra kalpler sürekli olarak üretilmeye başlar
            setInterval(createHeart, 150);
        }, 5500); // Kalplerin başlama süresini 3. yazıdan sonraya çektik

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = '🖤'; 
            
            if (Math.random() > 0.5) {
                heart.innerText = '🤍'; 
            }

            heart.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 2 + 1.5; 
            heart.style.fontSize = size + 'rem';
            
            const duration = Math.random() * 2 + 3;
            heart.style.animationDuration = duration + 's';

            heartContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }
    </script>
